services:
  db:
    image: pgvector/pgvector:pg17
    container_name: assistent-db
    environment:
      POSTGRES_USER: assistent
      POSTGRES_PASSWORD: assistent
      POSTGRES_DB: assistent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata:
